name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: |
          pnpm audit --audit-level high
          pnpm test:unit
          pnpm verify:core-version
          pnpm run verify:release -- "$GITHUB_REF_NAME" --check-registry

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            cmake_flags: "--CDGGML_METAL=ON --CDGGML_METAL_EMBED_LIBRARY=ON"
          - os: macos-15-intel
            platform: darwin
            arch: x64
            cmake_flags: "--CDGGML_METAL=ON --CDGGML_METAL_EMBED_LIBRARY=ON"
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            cmake_flags: ""
          - os: windows-2022
            platform: win32
            arch: x64
            cmake_flags: ""

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        working-directory: packages/native
        run: npx cmake-js compile ${{ matrix.cmake_flags }} --CDLLAMA_BUILD_TESTS=OFF --CDLLAMA_BUILD_EXAMPLES=OFF --CDLLAMA_BUILD_TOOLS=OFF --CDLLAMA_BUILD_SERVER=OFF

      - name: Native lifetime regression (Linux)
        if: matrix.platform == 'linux'
        run: |
          curl --fail --location \
            --output /tmp/stories15M-q4_0.gguf \
            'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M-q4_0.gguf?download=true'
          test "$(sha256sum /tmp/stories15M-q4_0.gguf | cut -d ' ' -f1)" = \
            "66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739"
          LOCAL_LLM_SMOKE_MODEL=/tmp/stories15M-q4_0.gguf pnpm test:native-lifetime

      - name: Copy binary to platform package
        shell: bash
        run: |
          PLATFORM_DIR="packages/platforms/${{ matrix.platform }}-${{ matrix.arch }}"
          cp packages/native/build/Release/hilum_native.node "$PLATFORM_DIR/local-llm.node"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/platforms/${{ matrix.platform }}-${{ matrix.arch }}/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    name: Publish to npm

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit and test package
        run: pnpm audit --audit-level high && pnpm test:unit && pnpm verify:core-version

      - name: Validate release version
        run: pnpm run verify:release -- "$GITHUB_REF_NAME" --check-registry

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy binaries to platform packages
        run: |
          for dir in artifacts/local-llm-*/; do
            platform_name=$(basename "$dir" | sed 's/local-llm-//')
            target="packages/platforms/$platform_name/"
            cp "$dir/local-llm.node" "$target/local-llm.node"
            echo "Copied binary to $target"
            ls -la "$target"
          done

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/platforms/*/; do
            if [ -f "$dir/local-llm.node" ]; then
              echo "Publishing $(basename $dir)..."
              cd "$dir"
              npm publish --access public
              cd -
            else
              echo "Skipping $(basename $dir) — no binary"
            fi
          done

      - name: Build main package
        run: pnpm --filter local-llm build

      - name: Verify packed main package manifest
        run: |
          mkdir -p /tmp/local-llm-pack-check
          env npm_config_cache=/tmp/local-llm-npm-cache npm pack --json --pack-destination /tmp/local-llm-pack-check ./packages/local-llm
          node ./scripts/package-manifest-guard.mjs verify-tarball /tmp/local-llm-pack-check/local-llm-*.tgz

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/local-llm
        run: npm publish --access public

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/local-llm-*/; do
            platform_name=$(basename "$dir" | sed 's/local-llm-//')
            src="$dir/local-llm.node"
            if [ -f "$src" ]; then
              cp "$src" "release-assets/local-llm-${platform_name}.node"
            fi
          done
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.node

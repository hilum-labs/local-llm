name: Build Native Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            cmake_flags: "--CDGGML_METAL=ON --CDGGML_METAL_EMBED_LIBRARY=ON --CDGGML_LTO=ON"
          - os: macos-15-intel
            platform: darwin
            arch: x64
            cmake_flags: "--CDGGML_METAL=ON --CDGGML_METAL_EMBED_LIBRARY=ON --CDGGML_LTO=ON"
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            cmake_flags: "--CDGGML_NATIVE=OFF --CDGGML_LTO=ON"
          - os: windows-2022
            platform: win32
            arch: x64
            cmake_flags: "--CDGGML_NATIVE=OFF --CDGGML_LTO=ON"

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Build native addon
        working-directory: packages/native
        run: npx cmake-js compile ${{ matrix.cmake_flags }}

      - name: Copy binary to platform package
        shell: bash
        run: |
          PLATFORM_DIR="packages/platforms/${{ matrix.platform }}-${{ matrix.arch }}"
          cp packages/native/build/Release/hilum_native.node "$PLATFORM_DIR/local-llm.node"
          ls -la "$PLATFORM_DIR/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/platforms/${{ matrix.platform }}-${{ matrix.arch }}/local-llm.node
          retention-days: 30

      - name: Build TypeScript package
        run: pnpm --filter local-llm build

      - name: Unit tests
        run: pnpm test:unit

      - name: Native lifetime regression (Linux)
        if: matrix.platform == 'linux'
        run: |
          curl --fail --location \
            --output /tmp/stories15M-q4_0.gguf \
            'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M-q4_0.gguf?download=true'
          test "$(sha256sum /tmp/stories15M-q4_0.gguf | cut -d ' ' -f1)" = \
            "66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739"
          LOCAL_LLM_SMOKE_MODEL=/tmp/stories15M-q4_0.gguf pnpm test:native-lifetime

      - name: Smoke test — binary loads (non-Windows)
        if: matrix.platform != 'win32'
        run: |
          node -e "
            const path = require('path');
            const binary = require(path.join(process.cwd(), 'packages/platforms/${{ matrix.platform }}-${{ matrix.arch }}/local-llm.node'));
            console.log('Binary loaded OK');
            console.log('backendVersion:', binary.backendVersion());
            console.log('backendInfo:', binary.backendInfo().substring(0, 100));
          "

      - name: Cache test model
        if: matrix.platform != 'win32'
        uses: actions/cache@v4
        with:
          path: ~/.local-llm/models
          key: smoke-test-model-tinyllama-q4km

      - name: Smoke test — inference (non-Windows)
        if: matrix.platform != 'win32'
        run: npx tsx scripts/ci-smoke-test.ts
        timeout-minutes: 10
